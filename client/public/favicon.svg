<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients restricted strictly to brand colors -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C2A21" />
      <stop offset="50%" stop-color="#EEDCC6" />
      <stop offset="100%" stop-color="#F4E8D1" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E8D1" />
      <stop offset="60%" stop-color="#EEDCC6" />
      <stop offset="100%" stop-color="#3C2A21" />
    </linearGradient>
    <linearGradient id="vortexGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2A1B16" />
      <stop offset="50%" stop-color="#3C2A21" />
      <stop offset="100%" stop-color="#EEDCC6" />
    </linearGradient>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="50" cy="50" r="48" fill="#2A1B16" stroke="#EEDCC6" stroke-width="2"/>
  
  <!-- Outer Subtle Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#3C2A21" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Ribbon 1: Rising Coffee Steam (HOT) - Flowing Curved Wave -->
  <path d="M 38 72 C 34 62, 36 50, 48 44 C 58 38, 54 28, 48 20 C 56 24, 62 34, 54 44 C 44 54, 46 64, 52 70 Z" 
        fill="url(#steamGrad)" opacity="0.95" />

  <!-- Ribbon 2: Ice Crystal (COOL) - Angular Interlocking Facet -->
  <path d="M 50 20 L 68 34 L 62 56 L 48 44 L 58 36 Z" 
        fill="url(#iceGrad)" opacity="0.9" />

  <!-- Ribbon 3: Vortex Blended Wave (SHAKE) - Dynamic Centrifugal Ribbon -->
  <path d="M 32 40 C 40 32, 60 30, 68 46 C 74 58, 62 74, 46 76 C 34 78, 24 64, 30 52 C 34 44, 44 42, 50 48 C 42 50, 36 56, 38 64 C 42 70, 56 68, 60 58 C 64 48, 50 40, 38 46 Z" 
        fill="url(#vortexGrad)" />

  <!-- Core Triple-Wave Isometric Focal Dot -->
  <circle cx="50" cy="48" r="3.5" fill="#F4E8D1" stroke="#2A1B16" stroke-width="1"/>
</svg>