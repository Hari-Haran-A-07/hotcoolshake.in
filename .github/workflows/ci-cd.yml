name: HOT COOL SHAKE Continuous Integration & Build Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Node ${{ matrix.node-version }} - Test & Build Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: |
          npm ci || npm install
          npm install --prefix client

      - name: Run Backend Integration & Health Test Suite
        run: npm run test:api

      - name: Production Build Frontend Client
        run: npm run build

      - name: Upload Client Production Bundle Artifact
        if: matrix.node-version == '20.x' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hotcoolshake-dist
          path: client/dist
          retention-days: 7
